<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Codex · 天象模型选择器</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="content-window">
    <section class="welcome" aria-label="欢迎">
      <span class="codex-mark" aria-hidden="true"></span>
      <h1>我们要构建什么？</h1>
    </section>

    <section class="composer-wrap" aria-label="输入区">
      <div class="scopebar">
        <span class="scope">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="13" rx="2"/><path d="M2 20h20"/></svg>
          此计算机
        </span>
        <span class="scope muted">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          选择项目
        </span>
      </div>
      <div class="composer">
        <textarea class="input" aria-label="输入消息" placeholder="随心输入" rows="1" autofocus></textarea>
        <div class="composer-actions">
          <button class="add" type="button" aria-label="添加">＋</button>
          <span class="access">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v5m0 3h.01"/></svg>
            完全访问
          </span>
          <span class="action-spacer"></span>
          <div class="model-slot">
            <span class="fallback-model"><span class="model-prefix">GPT-6.2&nbsp;</span>Astra <span class="effort">Ultra</span><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 6 4 4 4-4"/></svg></span>
            <div class="picker-host" id="pickerHost">
              <button type="button" class="model-trigger" id="modelTrigger" aria-controls="selectionPanel" aria-haspopup="dialog" aria-expanded="false">
                <span id="triggerModel">GPT-6.2 Astra</span><span class="effort-name" id="triggerEffort">Ultra</span>
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>
              </button>
              <section id="selectionPanel" class="selection-panel" role="dialog" aria-label="模型与推理强度" hidden>
                <div id="quickView">
                  <div class="effort-row">
                    <button type="button" id="speedToggle" class="speed-toggle" aria-label="速度：常速。点击切换到 Fast" title="常速 · 点击切换到 Fast">
                      <svg class="bolt-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M11.2 2.1 3.7 11h5.6l-.7 6.9 7.8-10h-5.8z"/></svg>
                      <span id="speedLabel" aria-hidden="true"></span>
                    </button>
                    <div class="model-version">
                      <button class="version-link" id="openVersions" type="button" aria-controls="versionView" title="选择模型"><span id="versionName">Astra</span></button>
                      <span class="version-separator" aria-hidden="true">-</span>
                      <button class="version-link" id="openFamilyVersions" type="button" aria-controls="versionView"><span id="versionNumber">6.2</span></button>
                    </div>
                    <button type="button" class="restore mini-icon" id="restore" aria-label="还原初始选择" title="还原为 GPT-6.2 Astra · Ultra · 常速"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3.8 7.7a6.6 6.6 0 1 1-.2 3.9M3.8 3.6v4.3h4.3"/></svg></button>
                  </div>
                  <div class="effort-menu" id="effortMenu" role="dialog" aria-label="选择级别" hidden>
                    <div id="effortList" class="effort-list" role="group" aria-label="推理强度"></div>
                  </div>
                  <div class="control-pair">
                    <div class="model-rail" id="rail">
                      <canvas id="sky" aria-hidden="true"></canvas>
                      <input id="familySlider" type="range" min="0" max="4" step="0.001" value="3" aria-label="模型" aria-valuetext="GPT-6.2 Astra" title="拖动或点击选择模型">
                      <div class="rail-centers" aria-hidden="true">
                        <span class="model-thumb"></span>
                      </div>
                    </div>
                    <div class="family-stops" aria-label="模型系列">
                      <button type="button" data-family="0">Terra</button><button type="button" data-family="1">Luna</button><button type="button" data-family="2">Sol</button><button type="button" data-family="3">Astra</button><button type="button" data-family="4">Bel</button>
                    </div>
                    <button id="dial" class="effort-dial" type="button" aria-controls="effortMenu" aria-haspopup="dialog" aria-expanded="false" title="点击选择级别。向上或向右滑动提高，向下或向左滑动降低。">
                      <span class="dial-shell" aria-hidden="true"><span class="dial-marks"></span><span class="dial-arc"></span><span class="dial-face"><span class="dial-hand"></span></span></span>
                      <span class="effort-name" id="quickEffort">Ultra</span>
                    </button>
                  </div>
                </div>
                <div id="versionView" hidden>
                  <div class="version-heading"><button type="button" id="backQuick" class="mini-icon" aria-label="返回模型滑轨"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m10 3.5-4.5 4.5 4.5 4.5"/></svg></button><span id="versionHeading">选择模型</span></div>
                  <div class="version-scroll" id="versionList" role="group" aria-labelledby="versionHeading"></div>
                </div>
              </section>
            </div>
          </div>
          <button class="mic" type="button" aria-label="语音输入">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3"/></svg>
          </button>
          <button class="primary-action" type="button" aria-label="语音模式">
            <svg class="wave-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 14v-4m3 7V7m4 12V5m4 12V7m3 7v-4"/></svg>
            <svg class="send-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const input=document.querySelector('.input');
      const action=document.querySelector('.primary-action');
      input.addEventListener('input',()=>{
        const filled=input.value.trim().length>0;
        action.classList.toggle('has-input',filled);
        action.setAttribute('aria-label',filled?'发送':'语音模式');
      });
    })();
  </script>
  <script src="assets/sky-textures.js"></script>
  <script src="src/scene.js"></script>
  <script src="src/controls.js"></script>
</body>
</html>
